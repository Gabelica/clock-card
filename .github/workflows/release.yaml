name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload clock-card.js to release
        uses: softprops/action-gh-release@v2
        with:
          files: clock-card.js